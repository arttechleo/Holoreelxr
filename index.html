<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Holoreel</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000; /* fully black */
        color: #eee;
        font-family: system-ui, Arial;
        display: flex;
        flex-direction: column;
        justify-content: center; /* centers vertically */
        align-items: center;      /* centers horizontally */
        overflow: hidden;
      }
      
      /* Aggressively hide canvas and all 3D content on index page */
      canvas {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        pointer-events: none !important;
        z-index: -99999 !important;
        transform: scale(0) !important;
      }
      
      /* Hide any WebGL or Three.js containers */
      body > canvas,
      #app,
      [data-threejs],
      .threejs-container {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        z-index: -99999 !important;
        pointer-events: none !important;
      }
      
      /* Logo container */
      #logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2rem;
        pointer-events: none;
      }
      
      #logo-container img {
        max-width: 300px;
        width: 100%;
        height: auto;
      }
      
      /* CTA Button */
      .ar-cta-button {
        position: relative;
        z-index: 10;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      /* Visible silver button label */
      .ar-cta-label {
        padding: 0.9rem 2.8rem;
        border-radius: 999px;
        background: linear-gradient(
          145deg,
          #f8f8f8 0%,
          #d9d9d9 30%,
          #bfbfbf 50%,
          #e6e6e6 75%,
          #ffffff 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #000;
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        position: relative;
        z-index: 11;
      }
      
      /* Hover / Focus */
      .ar-cta-button:hover .ar-cta-label,
      .ar-cta-button:focus-visible .ar-cta-label {
        transform: translateY(-1px) scale(1.03);
        box-shadow:
          0 0 25px rgba(255, 255, 255, 0.8),
          0 0 55px rgba(255, 255, 255, 0.9);
        filter: brightness(1.15);
      }
      
      /* Pressed */
      .ar-cta-button:active .ar-cta-label {
        transform: translateY(1px) scale(0.97);
        filter: brightness(0.9);
      }
      
      /* Hide XR bar by default - only show when needed */
      #xr-bar {
        display: none;
      }
      
      /* Hide upload 3D model feature (AssetLinkUI) */
      #asset-link-ui,
      .asset-link-ui-container {
        display: none !important;
        visibility: hidden !important;
      }
      
      .xr-overlay * { pointer-events: auto; } /* keep DOM HUD clickable in AR overlay */
    </style>
  </head>
  <body>
    <div id="logo-container">
      <img src="/logo/holoreelLogo.png" alt="Holoreel Logo" />
    </div>
    
    <button id="enter-ar" class="ar-cta-button">
      <span class="ar-cta-label">Enter AR</span>
    </button>
    
    <div id="xr-bar">
      <!-- XR controls will be shown when AR is active -->
    </div>
    
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Aggressively hide canvas immediately after it's created
      (function() {
        const hideCanvas = () => {
          const canvases = document.querySelectorAll('canvas');
          canvases.forEach(canvas => {
            canvas.style.display = 'none';
            canvas.style.visibility = 'hidden';
            canvas.style.opacity = '0';
            canvas.style.position = 'fixed';
            canvas.style.top = '-9999px';
            canvas.style.left = '-9999px';
            canvas.style.width = '1px';
            canvas.style.height = '1px';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '-99999';
            canvas.style.transform = 'scale(0)';
          });
        };
        
        // Hide immediately
        hideCanvas();
        
        // Watch for new canvases
        const observer = new MutationObserver(() => {
          hideCanvas();
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
        
        // Also hide on load
        window.addEventListener('load', hideCanvas);
        document.addEventListener('DOMContentLoaded', hideCanvas);
      })();
    </script>
  </body>
</html>
