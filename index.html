<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Holoreel</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000; /* fully black */
        color: #eee;
        font-family: system-ui, Arial;
        display: flex;
        flex-direction: column;
        justify-content: center; /* centers vertically */
        align-items: center;      /* centers horizontally */
        overflow: hidden;
      }
      
      /* Aggressively hide canvas and all 3D content on index page */
      canvas {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        pointer-events: none !important;
        z-index: -99999 !important;
        transform: scale(0) !important;
      }
      
      /* Ensure canvas never covers the button */
      body > canvas {
        z-index: -1 !important;
      }
      
      /* Hide any WebGL or Three.js containers */
      body > canvas,
      #app,
      [data-threejs],
      .threejs-container {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        z-index: -99999 !important;
        pointer-events: none !important;
      }
      
      /* Logo container - positioned fixed to stay above canvas */
      #logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2rem;
        pointer-events: none;
        position: fixed !important;
        z-index: 999998 !important; /* Just below button */
        left: 50%;
        top: 50%;
        transform: translate(-50%, calc(-50% - 100px)); /* Position above center */
      }
      
      #logo-container img {
        max-width: 300px;
        width: 100%;
        height: auto;
      }
      
      /* CTA Button - always visible, positioned outside canvas */
      .ar-cta-button {
        position: fixed !important;
        z-index: 999999 !important; /* Extremely high z-index to stay above canvas */
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex !important;
        align-items: center;
        justify-content: center;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        /* Center the button on screen */
        left: 50%;
        top: 50%;
        transform: translate(-50%, calc(-50% + 150px)); /* Position below center (where logo is) */
      }
      
      /* Ensure button stays visible even when XR overlay is active */
      body.xr-overlay .ar-cta-button,
      .xr-overlay .ar-cta-button {
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
        z-index: 999999 !important;
        position: fixed !important;
      }
      
      /* Visible silver button label - always visible */
      .ar-cta-label {
        padding: 0.9rem 2.8rem;
        border-radius: 999px;
        background: linear-gradient(
          145deg,
          #f8f8f8 0%,
          #d9d9d9 30%,
          #bfbfbf 50%,
          #e6e6e6 75%,
          #ffffff 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #000;
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        position: relative;
        z-index: 1000000 !important; /* Even higher than button */
        display: inline-flex !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      
      /* Ensure label stays visible even when XR overlay is active */
      body.xr-overlay .ar-cta-label,
      .xr-overlay .ar-cta-label {
        display: inline-flex !important;
        visibility: visible !important;
        opacity: 1 !important;
        z-index: 1000000 !important;
      }
      
      /* Hover / Focus */
      .ar-cta-button:hover .ar-cta-label,
      .ar-cta-button:focus-visible .ar-cta-label {
        transform: translateY(-1px) scale(1.03);
        box-shadow:
          0 0 25px rgba(255, 255, 255, 0.8),
          0 0 55px rgba(255, 255, 255, 0.9);
        filter: brightness(1.15);
      }
      
      /* Pressed */
      .ar-cta-button:active .ar-cta-label {
        transform: translateY(1px) scale(0.97);
        filter: brightness(0.9);
      }
      
      /* Hide XR bar by default - only show when needed */
      #xr-bar {
        display: none;
      }
      
      /* Hide upload 3D model feature (AssetLinkUI) */
      #asset-link-ui,
      .asset-link-ui-container {
        display: none !important;
        visibility: hidden !important;
      }
      
      .xr-overlay * { pointer-events: auto; } /* keep DOM HUD clickable in AR overlay */
    </style>
  </head>
  <body>
    <div id="logo-container">
      <img src="/logo/holoreelLogo.png" alt="Holoreel Logo" />
    </div>
    
    <button id="enter-ar" class="ar-cta-button">
      <span class="ar-cta-label">Enter AR</span>
    </button>
    
    <div id="xr-bar">
      <!-- XR controls will be shown when AR is active -->
    </div>
    
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Aggressively hide canvas immediately after it's created
      (function() {
        const hideCanvas = () => {
          const canvases = document.querySelectorAll('canvas');
          canvases.forEach(canvas => {
            canvas.style.display = 'none';
            canvas.style.visibility = 'hidden';
            canvas.style.opacity = '0';
            canvas.style.position = 'fixed';
            canvas.style.top = '-9999px';
            canvas.style.left = '-9999px';
            canvas.style.width = '1px';
            canvas.style.height = '1px';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '-99999';
            canvas.style.transform = 'scale(0)';
          });
        };
        
        // Hide immediately
        hideCanvas();
        
        // Watch for new canvases
        const observer = new MutationObserver(() => {
          hideCanvas();
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
        
        // Also hide on load
        window.addEventListener('load', hideCanvas);
        document.addEventListener('DOMContentLoaded', hideCanvas);
      })();
      
      // CRITICAL: Keep Enter AR button visible at all times, above canvas
      (function() {
        const ensureButtonVisible = () => {
          const button = document.getElementById('enter-ar');
          const label = button?.querySelector('.ar-cta-label');
          const logo = document.getElementById('logo-container');
          
          if (button) {
            // Force button visibility with fixed positioning
            button.style.display = 'flex';
            button.style.visibility = 'visible';
            button.style.opacity = '1';
            button.style.pointerEvents = 'auto';
            button.style.position = 'fixed';
            button.style.zIndex = '999999';
            button.style.left = '50%';
            button.style.top = '50%';
            button.style.transform = 'translate(-50%, calc(-50% + 150px))';
            
            // Ensure label exists and is visible
            if (!label && button.textContent) {
              // If label was removed, recreate it
              const span = document.createElement('span');
              span.className = 'ar-cta-label';
              span.textContent = button.textContent || 'Enter AR';
              button.textContent = '';
              button.appendChild(span);
            } else if (label) {
              // Ensure label is visible
              label.style.display = 'inline-flex';
              label.style.visibility = 'visible';
              label.style.opacity = '1';
              label.style.zIndex = '1000000';
            }
          }
          
          // Also ensure logo stays visible
          if (logo) {
            logo.style.position = 'fixed';
            logo.style.zIndex = '999998';
            logo.style.left = '50%';
            logo.style.top = '50%';
            logo.style.transform = 'translate(-50%, calc(-50% - 100px))';
          }
          
          // Ensure all canvases have low z-index
          document.querySelectorAll('canvas').forEach(canvas => {
            canvas.style.zIndex = '-1';
          });
        };
        
        // Run immediately
        ensureButtonVisible();
        
        // Run after DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', ensureButtonVisible);
        }
        
        // Run after page load
        window.addEventListener('load', ensureButtonVisible);
        
        // Monitor for changes and restore visibility
        const observer = new MutationObserver(() => {
          ensureButtonVisible();
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['style', 'class']
        });
        
        // Also check periodically (fallback)
        setInterval(ensureButtonVisible, 500);
      })();
    </script>
  </body>
</html>
