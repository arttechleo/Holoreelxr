<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Holoreel</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: system-ui, Arial;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }
      
      /* Aggressively hide canvas and all 3D content on index page */
      canvas {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        pointer-events: none !important;
        z-index: -99999 !important;
        transform: scale(0) !important;
      }
      
      /* Hide any WebGL or Three.js containers */
      body > canvas,
      #app,
      [data-threejs],
      .threejs-container {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        z-index: -99999 !important;
        pointer-events: none !important;
      }
      
      /* Logo container - behind button */
      #logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 3rem;
        z-index: 1;
        position: relative;
        pointer-events: auto;
      }
      
      #logo-container img {
        max-width: 300px;
        width: 100%;
        height: auto;
      }
      
      /* CTA Button — SILVER VERSION - in front of logo */
      .ar-cta-button {
        position: relative;
        border: none;
        cursor: pointer;
        padding: 0;
        background: transparent;
        outline: none;
        z-index: 10 !important; /* Button in front of logo */
        pointer-events: auto !important;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      
      /* Soft glow behind button */
      .ar-cta-button::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(180,180,180,0.2));
        filter: blur(12px);
        opacity: 0.6;
        transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        z-index: 0;
      }
      
      /* Metallic silver core */
      .ar-cta-label {
        position: relative;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 2.8rem;
        border-radius: 999px;
        background: linear-gradient(
          145deg,
          #f8f8f8 0%,
          #d9d9d9 30%,
          #bfbfbf 50%,
          #e6e6e6 75%,
          #ffffff 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #000 !important; /* black text for contrast */
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.9rem;
        font-weight: 700;
        box-shadow:
          0 0 15px rgba(255, 255, 255, 0.4),
          0 0 35px rgba(255, 255, 255, 0.5);
        transition:
          transform 0.15s ease-out,
          box-shadow 0.15s ease-out,
          filter 0.15s ease-out;
        z-index: 11 !important; /* Label in front of button */
        pointer-events: auto !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      
      /* Metallic shine highlight */
      .ar-cta-label::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.65) 0%,
          rgba(255, 255, 255, 0.15) 40%,
          transparent 80%
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }
      
      /* Hover / Focus */
      .ar-cta-button:hover .ar-cta-label,
      .ar-cta-button:focus-visible .ar-cta-label {
        transform: translateY(-1px) scale(1.03);
        box-shadow:
          0 0 25px rgba(255, 255, 255, 0.8),
          0 0 55px rgba(255, 255, 255, 0.9);
        filter: brightness(1.15);
      }
      
      .ar-cta-button:hover::before,
      .ar-cta-button:focus-visible::before {
        opacity: 0.9;
        transform: scale(1.1);
      }
      
      /* Pressed */
      .ar-cta-button:active .ar-cta-label {
        transform: translateY(1px) scale(0.97);
        filter: brightness(0.9);
      }
      
      /* Hide XR bar by default - only show when needed */
      #xr-bar {
        display: none;
      }
      
      /* Hide upload 3D model feature (AssetLinkUI) */
      #asset-link-ui,
      .asset-link-ui-container {
        display: none !important;
        visibility: hidden !important;
      }
      
      .xr-overlay * { pointer-events: auto; } /* keep DOM HUD clickable in AR overlay */
    </style>
  </head>
  <body>
    <div id="logo-container">
      <img src="/logo/holoreelLogo.png" alt="Holoreel Logo" />
    </div>
    
    <button id="enter-ar" class="ar-cta-button">
      <!-- <span class="ar-cta-label">Enter AR</span> -->
    </button>
    
    <div id="xr-bar">
      <!-- XR controls will be shown when AR is active -->
    </div>
    
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Aggressively hide canvas immediately after it's created
      (function() {
        const hideCanvas = () => {
          const canvases = document.querySelectorAll('canvas');
          canvases.forEach(canvas => {
            canvas.style.display = 'none';
            canvas.style.visibility = 'hidden';
            canvas.style.opacity = '0';
            canvas.style.position = 'fixed';
            canvas.style.top = '-9999px';
            canvas.style.left = '-9999px';
            canvas.style.width = '1px';
            canvas.style.height = '1px';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '-99999';
            canvas.style.transform = 'scale(0)';
          });
        };
        
        // Hide immediately
        hideCanvas();
        
        // Watch for new canvases
        const observer = new MutationObserver(() => {
          hideCanvas();
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
        
        // Also hide on load
        window.addEventListener('load', hideCanvas);
        document.addEventListener('DOMContentLoaded', hideCanvas);
      })();
    </script>
  </body>
</html>
