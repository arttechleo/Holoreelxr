<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compose Comment - Holoreelxr</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.98);
        border-radius: 20px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        color: #1a202c;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #718096;
        font-size: 14px;
        margin-bottom: 30px;
      }

      .model-info {
        background: #f7fafc;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
        border-left: 4px solid #667eea;
      }

      .model-info strong {
        color: #2d3748;
        display: block;
        margin-bottom: 4px;
      }

      .model-info span {
        color: #718096;
        font-size: 14px;
      }

      label {
        display: block;
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 8px;
        font-size: 14px;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        padding: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 16px;
        font-family: inherit;
        resize: vertical;
        transition: all 0.2s;
        background: white;
      }

      textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .char-count {
        text-align: right;
        font-size: 13px;
        color: #a0aec0;
        margin-top: 8px;
        margin-bottom: 20px;
      }

      .char-count.warning {
        color: #f6ad55;
      }

      .char-count.error {
        color: #fc8181;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      button {
        padding: 14px 32px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        font-family: inherit;
      }

      .btn-cancel {
        background: #e2e8f0;
        color: #4a5568;
      }

      .btn-cancel:hover {
        background: #cbd5e0;
      }

      .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        position: relative;
        overflow: hidden;
      }

      .btn-submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .success-message {
        display: none;
        background: #48bb78;
        color: white;
        padding: 16px;
        border-radius: 12px;
        margin-top: 20px;
        text-align: center;
        font-weight: 600;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .emoji-hint {
        font-size: 13px;
        color: #a0aec0;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>✍️ Compose Comment</h1>
      <p class="subtitle">Share your thoughts on this 3D content</p>

      <div class="model-info">
        <strong>Commenting on:</strong>
        <span id="model-key">Loading...</span>
      </div>

      <form id="compose-form">
        <label for="comment-text">Your Comment</label>
        <textarea
          id="comment-text"
          name="comment"
          placeholder="What do you think about this? Share your reaction..."
          maxlength="500"
          required
          autofocus
        ></textarea>
        <div class="char-count" id="char-count">0 / 500</div>

        <p class="emoji-hint">💡 Tip: Feel free to use emojis! 😊 🎉 ✨</p>

        <div class="actions">
          <button type="button" class="btn-cancel" id="cancel-btn">
            Cancel
          </button>
          <button type="submit" class="btn-submit" id="submit-btn">
            Post Comment
          </button>
        </div>
      </form>

      <div class="success-message" id="success-message">
        ✅ Comment posted successfully! Closing window...
      </div>
    </div>

    <script>
      // Parse URL params
      const params = new URLSearchParams(window.location.search);
      const modelKey = params.get('k') || 'Unknown Model';
      const prefill = params.get('t') || '';

      // Display model key
      document.getElementById('model-key').textContent = modelKey;

      // Prefill textarea if provided
      const textarea = document.getElementById('comment-text');
      if (prefill) {
        textarea.value = prefill;
        updateCharCount();
      }

      // Character counter
      function updateCharCount() {
        const count = textarea.value.length;
        const display = document.getElementById('char-count');
        display.textContent = `${count} / 500`;
        
        if (count > 450) {
          display.classList.add('error');
          display.classList.remove('warning');
        } else if (count > 400) {
          display.classList.add('warning');
          display.classList.remove('error');
        } else {
          display.classList.remove('warning', 'error');
        }
      }

      textarea.addEventListener('input', updateCharCount);

      // Form submission
      const form = document.getElementById('compose-form');
      const submitBtn = document.getElementById('submit-btn');
      const successMsg = document.getElementById('success-message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const text = textarea.value.trim();
        if (!text) return;

        // Disable form
        submitBtn.disabled = true;
        submitBtn.textContent = 'Posting...';

        try {
          // Simulate API call (replace with actual backend integration)
          await new Promise(resolve => setTimeout(resolve, 800));

          // In a real app, you'd POST to an API here:
          // await fetch('/api/comments', {
          //   method: 'POST',
          //   headers: { 'Content-Type': 'application/json' },
          //   body: JSON.stringify({ modelKey, text })
          // });

          // For now, just store locally and notify opener
          const comment = {
            id: `c-${Date.now()}`,
            modelKey,
            text,
            author: 'You',
            timestamp: new Date().toISOString()
          };

          // Try to communicate with opener window (XR session)
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: 'holoreelxr:comment',
              comment
            }, '*');
          }

          // Show success
          form.style.display = 'none';
          successMsg.style.display = 'block';

          // Close window after delay
          setTimeout(() => {
            window.close();
          }, 2000);

        } catch (error) {
          console.error('Failed to post comment:', error);
          alert('Failed to post comment. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Post Comment';
        }
      });

      // Cancel button
      document.getElementById('cancel-btn').addEventListener('click', () => {
        if (confirm('Discard your comment?')) {
          window.close();
        }
      });

      // Listen for messages from XR session (keyboard input, etc.)
      window.addEventListener('message', (event) => {
        if (event.data?.type === 'holoreelxr:setText') {
          textarea.value = event.data.text || '';
          updateCharCount();
        }
      });
    </script>
  </body>
</html>
